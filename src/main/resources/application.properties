spring.application.name=twitter

# Proje kokundeki .env dosyasini (varsa) properties olarak oku.
# .env, .gitignore icinde oldugu icin GitHub'a gitmez.
spring.config.import=optional:file:.env[.properties]
server.port=3000

# Sifreyi koda yazmamak icin ortam degiskeninden okuyoruz.
# DB_PASSWORD tanimli degilse varsayilan "postgres" kullanilir.
spring.datasource.url=jdbc:postgresql://localhost:5432/twitter
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Gelistirme icin: tablolari entity'lere gore Hibernate olusturur/gunceller.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Lazy iliskileri view katmaninda acik tutmayi kapat (anti-pattern, uyariyi da susturur)
spring.jpa.open-in-view=false

# JWT: imzalama anahtari .env'den gelir (HS256 icin en az 32 byte).
# Tanimli degilse uygulama BILEREK baslamaz; zayif bir varsayilan anahtar koymuyoruz.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60
